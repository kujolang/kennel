name: Build official release package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'release' && github.event.action == 'published' && (github.repository == 'kujolang/kennel' || github.repository == 'kujolang/changebucket')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel
          ref: f2e898ceadd91a07f80de61804a6ae7e9f3637fb
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel-registry
          path: registry-policy
          persist-credentials: false
      - name: Restore pinned publisher runtime
        id: native-runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: kujo-bin
          key: kennel-publisher-linux-3bf77fcc418ce3b5bf7a5fd0097ae602f3e7d6a8
      - name: Checkout pinned Kujo runtime
        if: steps.native-runtime.outputs.cache-hit != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kujo
          ref: 3bf77fcc418ce3b5bf7a5fd0097ae602f3e7d6a8
          path: kujo-src
          persist-credentials: false
      - name: Setup Rust
        if: steps.native-runtime.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Build pinned Kujo runtime
        if: steps.native-runtime.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release --manifest-path kujo-src/Cargo.toml --bin kujo
          mkdir -p kujo-bin
          cp kujo-src/target/release/kujo kujo-bin/kujo
      - name: Configure native publisher
        run: |
          echo "KUJO_BIN=$GITHUB_WORKSPACE/kujo-bin/kujo" >> "$GITHUB_ENV"
          echo "KUJO_MODULE_PATH=$GITHUB_WORKSPACE/publisher" >> "$GITHUB_ENV"
      - name: Build exact published release
        env:
          GH_TOKEN: ${{ github.token }}
          KENNEL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          KENNEL_WORKFLOW_REF: ${{ github.workflow_ref }}
          PACKAGE: ${{ github.event.repository.name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          "$KUJO_BIN" run publisher/scripts/registry/sync_releases.kujo --interpreter --isolated-imports -- --root release-package --policy registry-policy/official-packages.json --package "$PACKAGE" --release-id "$RELEASE_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kennel-release-package
          path: release-package/packages/
          if-no-files-found: error
