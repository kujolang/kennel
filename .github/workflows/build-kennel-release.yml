name: Build official release package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'release' && github.event.action == 'published' && (github.repository == 'kujolang/kennel' || github.repository == 'kujolang/changebucket')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel
          ref: 08a6cf3152f9e3888a14b9819b9922b0d8cfc0c5
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel-registry
          path: registry-policy
          persist-credentials: false
      - name: Build exact published release
        env:
          GH_TOKEN: ${{ github.token }}
          KENNEL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          KENNEL_WORKFLOW_REF: ${{ github.workflow_ref }}
          PACKAGE: ${{ github.event.repository.name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          python3 publisher/scripts/registry/sync_releases.py --root release-package --policy registry-policy/official-packages.json --package "$PACKAGE" --release-id "$RELEASE_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kennel-release-package
          path: release-package/packages/
          if-no-files-found: error
