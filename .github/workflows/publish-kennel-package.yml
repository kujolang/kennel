name: Publish official Kennel packages
on:
  workflow_call:
    inputs:
      package:
        type: string
        default: ''
      release_id:
        type: string
        default: ''
permissions:
  contents: write
jobs:
  publish:
    # Registry-owned token can write only its own repository. No cross-repo PAT.
    if: github.repository == 'kujolang/kennel-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kennel-registry-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel-registry
          ref: main
          path: registry-repo
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel
          ref: e92dc670e3c726bc3511d0c5318883551c9e52e4
          path: publisher
          persist-credentials: false
      - name: Restore pinned publisher runtime
        id: native-runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: kujo-bin
          key: kennel-publisher-linux-87335fbaefa1b81e38737ce471cfda55e7e7e34c
      - name: Checkout pinned Kujo runtime
        if: steps.native-runtime.outputs.cache-hit != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kujo
          ref: 87335fbaefa1b81e38737ce471cfda55e7e7e34c
          path: kujo-src
          persist-credentials: false
      - name: Setup Rust
        if: steps.native-runtime.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Build pinned Kujo runtime
        if: steps.native-runtime.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release --manifest-path kujo-src/Cargo.toml --bin kujo
          mkdir -p kujo-bin
          cp kujo-src/target/release/kujo kujo-bin/kujo
      - name: Configure native publisher
        run: |
          echo "KUJO_BIN=$GITHUB_WORKSPACE/kujo-bin/kujo" >> "$GITHUB_ENV"
          echo "KUJO_MODULE_PATH=$GITHUB_WORKSPACE/publisher" >> "$GITHUB_ENV"
      - name: Build from published releases and validate registry
        env:
          GH_TOKEN: ${{ github.token }}
          KENNEL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          KENNEL_WORKFLOW_REF: ${{ github.workflow_ref }}
          PACKAGE: ${{ inputs.package || (github.event_name == 'release' && github.event.repository.name) || '' }}
          RELEASE_ID: ${{ inputs.release_id || github.event.release.id || '' }}
        run: |
          "$KUJO_BIN" run publisher/scripts/registry/sync_releases.kujo --interpreter --isolated-imports -- --root registry-repo/registry --policy registry-repo/official-packages.json --package "$PACKAGE" --release-id "$RELEASE_ID"
      - name: Publish one atomic registry commit
        working-directory: registry-repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified official package releases'
            git push origin HEAD:main
          fi
      - name: Verify deployed package discovery
        run: |
          "$KUJO_BIN" run publisher/scripts/registry/verify_deployment.kujo --interpreter --isolated-imports -- registry-repo/registry
