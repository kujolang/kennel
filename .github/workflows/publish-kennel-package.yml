name: Publish official Kennel packages
on:
  workflow_call:
    inputs:
      package:
        type: string
        default: ''
      release_id:
        type: string
        default: ''
permissions:
  contents: write
jobs:
  publish:
    # Registry-owned token can write only its own repository. No cross-repo PAT.
    if: github.repository == 'kujolang/kennel-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kennel-registry-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel-registry
          ref: main
          path: registry-repo
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: kujolang/kennel
          ref: 8a1aec7ec820101402d54c2510e1a398e60714d5
          path: publisher
          persist-credentials: false
      - name: Install checksum-verified Kujo 1.8.2
        id: runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@549bdb4d5aa8edc60a83c81bf3be4b1c688ad3e1
        with:
          version: v1.8.2
      - name: Configure native publisher
        run: |
          echo "KUJO_BIN=${{ steps.runtime.outputs.kujo-path }}" >> "$GITHUB_ENV"
          echo "KUJO_MODULE_PATH=$GITHUB_WORKSPACE/publisher" >> "$GITHUB_ENV"
      - name: Build from published releases and validate registry
        env:
          GH_TOKEN: ${{ github.token }}
          KENNEL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          KENNEL_WORKFLOW_REF: ${{ github.workflow_ref }}
          PACKAGE: ${{ inputs.package || (github.event_name == 'release' && github.event.repository.name) || '' }}
          RELEASE_ID: ${{ inputs.release_id || github.event.release.id || '' }}
        run: |
          "$KUJO_BIN" run publisher/scripts/registry/sync_releases.kujo --interpreter --isolated-imports -- --root registry-repo/registry --policy registry-repo/official-packages.json --package "$PACKAGE" --release-id "$RELEASE_ID"
      - name: Publish one atomic registry commit
        working-directory: registry-repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified official package releases'
            git push origin HEAD:main
          fi
      - name: Verify deployed package discovery
        run: |
          "$KUJO_BIN" run publisher/scripts/registry/verify_deployment.kujo --interpreter --isolated-imports -- registry-repo/registry
